<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect to SLM</title>
    <!-- Add PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #fff; max-width: 600px; margin: 0 auto; }
        #setup-box { text-align: center; margin-top: 50px; }
        input[type="text"] { padding: 10px; font-size: 18px; width: 80%; margin-bottom: 10px; text-align: center; letter-spacing: 2px;}
        button { padding: 12px 24px; font-size: 16px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;}
        
        #chat-box { display: none; display: flex; flex-direction: column; height: 80vh; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; background: #f9f9f9; }
        .msg { padding: 10px; margin: 5px 0; border-radius: 8px; max-width: 80%; }
        .msg.user { background: #0070f3; color: white; align-self: flex-end; margin-left: auto;}
        .msg.ai { background: #e5e7eb; color: black; align-self: flex-start; }
        #input-area { display: flex; }
        #prompt-input { flex-grow: 1; padding: 10px; text-align: left; letter-spacing: normal;}
    </style>
</head>
<body>

    <div id="setup-box">
        <h2>Connect to Host</h2>
        <input type="text" id="room-input" placeholder="Enter 4-Digit Room Code" maxlength="4">
        <br>
        <button id="connect-btn">Connect</button>
        <p id="client-status"></p>
    </div>

    <div id="chat-box" style="display: none;">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="prompt-input" placeholder="Ask a question...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script type="module" src="./js/client/app.js"></script>
</body>
</html>
