<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Client</title>
    <!-- WebRTC, PDF.js, and jsPDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.1/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #fff; max-width: 600px; margin: 0 auto; position: relative;}
        input[type="text"], select { padding: 10px; font-size: 16px; width: 100%; margin-bottom: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc;}
        button { padding: 10px 15px; font-size: 15px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; flex-grow: 1; font-weight: bold;}
        .btn-ai { background: #0070f3; }
        .btn-peer { background: #f59e0b; }
        .btn-file { background: #6b7280; flex-grow: 0; }
        .btn-pdf-export { font-size: 12px; padding: 6px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; display: inline-block; margin-top: 10px;}
        
        #chat-box { display: none; flex-direction: column; height: 85vh; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; background: #f9f9f9; }
        .msg { padding: 12px; margin: 8px 0; border-radius: 8px; max-width: 85%; overflow-wrap: break-word; line-height: 1.4;}
        .msg.user { background: #0070f3; color: white; align-self: flex-end; margin-left: auto; }
        .msg.ai { background: #e5e7eb; color: black; align-self: flex-start; }
        .msg.peer { background: #fef3c7; color: #92400e; align-self: flex-start; border: 1px solid #fcd34d; }
        .msg.private { background: #fbcfe8; color: #831843; border-color: #f472b6; }
        .sender-name { font-size: 11px; opacity: 0.8; margin-bottom: 4px; font-weight: bold; text-transform: uppercase;}
        
        #attachment-indicator { display: none; padding: 8px; background: #d1fae5; color: #065f46; border-radius: 6px; margin-bottom: 10px; font-size: 14px; font-weight: bold; align-items: center; justify-content: space-between;}
        #remove-attachment { cursor: pointer; color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <!-- The Buffering Overlay -->
    <div id="buffer-overlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); color: white; align-items: center; justify-content: center; z-index: 1000; flex-direction: column;">
        <h2 style="color: #10b981;">Optimizing Memory</h2>
        <p id="buffer-msg">Compressing Cache...</p>
    </div>

    <div id="setup-box">
        <h2>Join Workspace</h2>
        <input type="text" id="name-input" placeholder="Your Name (Optional)">
        <input type="text" id="room-input" placeholder="4-Digit Room Code" maxlength="4" style="text-align: center; letter-spacing: 2px; font-size: 20px; font-weight: bold;">
        <button id="connect-btn">Connect</button>
        <p id="client-status"></p>
    </div>

    <div id="chat-box">
        <div id="messages"></div>
        
        <div id="attachment-indicator">
            <span id="attached-file-name">📎 Document attached</span>
            <span id="remove-attachment">✕</span>
        </div>

        <input type="file" id="file-input" accept=".txt,.pdf" style="display: none;">
        
        <div id="input-area">
            <input type="text" id="prompt-input" placeholder="Type message or click 📎 to attach document...">
            
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <select id="chat-target">
                    <option value="all">Send to: Everyone</option>
                </select>
            </div>

            <div style="display: flex; gap: 8px;">
                <button id="attach-btn" class="btn-file" title="Attach Document">📎</button>
                <button id="send-ai-btn" class="btn-ai">Ask AI</button>
                <button id="send-peer-btn" class="btn-peer">Send Chat</button>
            </div>
        </div>
    </div>
    
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
    <script type="module" src="./js/client/app.js"></script>
</body>
</html>
